<!doctype html>
<!-- Viewer Catalog & Roadmap — ONE page, two homes (doc 08 §10):
       * served live by the companion dashboard at /catalog (data: /api/catalog?all=1)
       * published as-is on GitHub Pages (data: catalog.json next to this file,
         regenerated by bridge/tools/export_catalog.py)
     It is a pure projection of bridge/twitch_bridge/catalog.py — never edit data here. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalog &amp; Roadmap — X4 ⇄ Twitch</title>
<style>
  :root{--bg:#0e0f1a;--card:#181a2b;--line:#272a42;--txt:#e7e9f5;--dim:#9aa0c3;--tw:#9146ff}
  *{box-sizing:border-box}
  body{margin:0;background:#0e0f1a;color:var(--txt);font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1060px;margin:0 auto;padding:22px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  h1{font-size:18px;margin:0}.sub{color:var(--dim);margin:0 0 16px}
  a.back{color:#56b6ff;text-decoration:none;font-size:13px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
  input.search{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px 12px;font-size:14px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;
    padding:5px 11px;font-size:12px;cursor:pointer;user-select:none}
  .chip.on{background:#9146ff22;border-color:var(--tw);color:#cbb6ff}
  .gap{width:6px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);cursor:pointer;border-top:0}
  td.buy{font-family:ui-monospace,monospace;color:#56b6ff;white-space:nowrap}
  td.cost{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .b{font-size:10px;font-weight:800;text-transform:uppercase;padding:1px 7px;border-radius:6px;white-space:nowrap}
  .t0{background:#37d67a22;color:#7ee2a8}.t1{background:#56b6ff22;color:#8cd0ff}
  .t2{background:#f5a62322;color:#ffce7a}.t3{background:#ec5b5b22;color:#ff9a9a}
  .s-live{background:#37d67a22;color:#7ee2a8}.s-wip{background:#56b6ff22;color:#8cd0ff}
  .s-planned{background:#9aa0c31f;color:#b9bedd}.s-suggested{background:#c678dd22;color:#e0a9f0}
  .k-good{color:#7ee2a8}.k-neutral{color:var(--dim)}.k-bad{color:#ffce7a}.k-doom{color:#ff9a9a}
  .desc{color:var(--dim);font-size:13px}
  .empty{color:var(--dim);padding:20px;text-align:center}
  footer{color:var(--dim);font-size:12px;margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px}
  footer b{color:var(--txt)}
</style></head><body><div class="wrap">
  <header><h1>🛒 Viewer Catalog &amp; Roadmap</h1></header>
  <p class="sub"><a class="back" id="back" href="/" style="display:none">← back to dashboard · </a><span id="src">loading…</span></p>
  <div class="controls">
    <input class="search" id="q" placeholder="search name / description / key…">
    <span class="chip on" data-tier="all">All tiers</span>
    <span class="chip" data-tier="0">Pure</span><span class="chip" data-tier="1">Minor</span>
    <span class="chip" data-tier="2">Major</span><span class="chip" data-tier="3">Doom</span>
    <span class="gap"></span>
    <span class="chip on" data-status="all">Any status</span>
    <span class="chip" data-status="live">Live</span><span class="chip" data-status="wip">WIP</span>
    <span class="chip" data-status="planned">Planned</span><span class="chip" data-status="suggested">Suggested</span>
  </div>
  <table><thead><tr>
    <th data-k="buy_key">Buy</th><th data-k="label">Name</th><th data-k="status">Status</th>
    <th data-k="cost">Cost</th><th data-k="tier">Tier</th><th data-k="karma">Karma</th>
    <th data-k="cooldown">CD</th><th>What it does</th>
  </tr></thead><tbody id="rows"></tbody></table>
  <div class="empty" id="empty" style="display:none">No matching events.</div>
  <footer>
    <span id="counts"></span>
    <span><b>live</b> in the game now · <b>wip</b> being built · <b>planned</b> designed, not started · <b>suggested</b> community idea</span>
  </footer>
</div>
<script>
const $=s=>document.querySelector(s);
const TIERN={0:'Pure',1:'Minor',2:'Major',3:'Doom'};
const SRANK={live:0,wip:1,planned:2,suggested:3};
let DATA=[], tier='all', status='all', q='', sortK='status', asc=true;
function esc(t){return (t??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function cost(r){return r.cost_per_unit?(r.cost_per_unit+'/'+(r.unit||'unit')):r.cost}
function render(){
  let rows=DATA.filter(r=>(tier==='all'||r.tier==+tier)&&(status==='all'||r.status===status));
  if(q){const s=q.toLowerCase();rows=rows.filter(r=>(r.label+' '+r.description+' '+r.buy_key).toLowerCase().includes(s))}
  rows.sort((a,b)=>{let x=a[sortK],y=b[sortK];
    if(sortK==='status'){x=SRANK[x]??9;y=SRANK[y]??9}
    if(typeof x==='string'){return asc?(''+x).localeCompare(y):(''+y).localeCompare(x)}
    return asc?x-y:y-x});
  $('#rows').innerHTML=rows.map(r=>`<tr>
    <td class="buy">${esc(r.syntax)}</td><td>${esc(r.label)}</td>
    <td><span class="b s-${esc(r.status)}">${esc(r.status)}</span></td>
    <td class="cost">${esc(cost(r))}</td>
    <td><span class="b t${r.tier}">${TIERN[r.tier]}</span></td>
    <td class="k-${esc(r.karma)}">${esc(r.karma)}</td>
    <td>${r.cooldown?Math.round(r.cooldown)+'s':'—'}</td>
    <td class="desc">${esc(r.description)}</td></tr>`).join('');
  $('#empty').style.display=rows.length?'none':'';
  const c={};DATA.forEach(r=>c[r.status]=(c[r.status]||0)+1);
  $('#counts').textContent=['live','wip','planned','suggested'].map(s=>(c[s]||0)+' '+s).join(' · ');
}
async function load(){
  try{ // live companion first (when this page is served at /catalog)
    const r=await fetch('/api/catalog?all=1',{cache:'no-store'}); if(!r.ok)throw 0;
    DATA=await r.json(); $('#back').style.display='';
    $('#src').textContent='live from the companion · single source: bridge/twitch_bridge/catalog.py';
  }catch(e){ // static export next to this file (GitHub Pages)
    try{
      const r=await fetch('catalog.json',{cache:'no-store'}); if(!r.ok)throw 0;
      DATA=await r.json();
      $('#src').textContent='static export · regenerated by bridge/tools/export_catalog.py';
    }catch(e2){
      $('#empty').textContent='no data: companion offline and no catalog.json next to this page';
      $('#empty').style.display=''; return;
    }
  }
  render();
}
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
document.querySelectorAll('.chip[data-tier]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip[data-tier]').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');tier=c.dataset.tier;render()});
document.querySelectorAll('.chip[data-status]').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.chip[data-status]').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');status=c.dataset.status;render()});
document.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;asc=(sortK===k)?!asc:true;sortK=k;render()});
load();
</script></body></html>
