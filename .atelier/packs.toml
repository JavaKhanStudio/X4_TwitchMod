[tags.companion]
label = "Companion"
description = "bridge/ as a process: app.py, x4link/ (unix socket + Windows pipe), protocol.py, config.py, runtime, dashboard + OAuth setup panel, launcher, sources/, run-companion.*, install.sh / install.ps1"
color = "#9146ff"
sort = 10
context = """
The companion is the only thing that talks to Twitch: X4's sandbox has no network and blocks
FFI `system` (docs/DEVLOG.md, "In-game process spawn via FFI — BLOCKED"). protocol.py is THE
contract: one compact JSON object a line. A new `t` type needs a constant there AND its
handler on the receiving side: a cue in extensions/twitch_integration/md/twitch_integration.xml
for bridge -> X4, an entry in Companion.x4_handlers in app.py (as FLEET, CMDFAIL) for X4 ->
bridge; a type with no entry goes to the source's handle_action (tools/test_app_routing.py).
Transport is per OS (x4link/): on Linux X4 HOSTS `<SAVE>/twitch.xml` and the bridge connects;
on Windows the bridge HOSTS `\\\\.\\pipe\\twitch` and X4 connects. PIPE_NAME in config.py must
match the MD pipe name "twitch".
Run it without Twitch or X4: `cd bridge && python3 -m twitch_bridge --source stdin --no-launcher
--socket /tmp/x.sock`, with `python3 bridge/tools/mock_x4.py --socket /tmp/x.sock` as the game.
ALWAYS pass --no-launcher: by default every start (re)installs an app-menu / Start Menu entry
(launcher.py, config.launcher). Under a board agent (ATELIER_AGENT set) the launcher and --open
are off whatever the flags say (launcher.board_agent, r2; tools/test_board_agent_quiet.py) —
the flag still matters for a run Simon starts. Dashboard: http://127.0.0.1:17564/ (config.py); OAuth redirect
is http://localhost:17563 (dashboard.py). Wallet and tokens live in ~/.config/x4-twitch-bridge/,
never in the repo (SECURITY.md).
Tests: `cd bridge && for t in tools/test_*.py; do case $t in *lua_decode*|*twitch_api*) py=py.exe;;
*) py=python3;; esac; $py $t || echo FAIL $t; done`. Those two need lupa / twitchAPI, which only
Windows py.exe has (WSL's python3 does not, and adding them is Simon's call); without the module
they now FAIL, never SKIP (r37). test_x4link_win.py fails off Windows (no create_pipe_connection)
— expected.
The working tree under WSL has CRLF shell scripts (git keeps them LF; no .gitattributes):
`bash bridge/tools/smoke_test.sh` dies on `$'\\r'`. From the root, run
`bash -c "$(tr -d '\\r' < bridge/tools/smoke_test.sh)" bridge/tools/smoke_test.sh` (the last
word keeps its `cd $(dirname $0)/..` right; 7 PASS lines). Never commit a line-ending-only change.
"""

[tags.economy]
label = "Economy & catalog"
description = "What viewers can buy and what it costs: catalog.py (the store = the roadmap), economy.py (chat commands, COMMAND_ALIASES), commands.py (roles, cooldowns), wallet.py (coins, karma), fleet.py (adopted ships), ships.py/sectors.py and their generated .json; docs/08, docs/10, docs/catalog/"
color = "#f0b429"
sort = 20
context = """
catalog.py is the single source of truth: the `!buy` engine, the dashboard /catalog page and
the static docs/catalog/ export all read CATALOG. Each StoreEvent has a `status` (live, wip,
planned, suggested) and a kind (info = answered bridge-side, effect = a cue in the MD).
`python3 bridge/tools/test_md_sync.py` FAILS when a `live` effect has no TODO-free MD cue, when
an implemented cue is not marked live, or when buy_key + nicknames != COMMAND_ALIASES[id] in
economy.py. So a new command touches catalog.py, economy.py's COMMAND_ALIASES and the MD cue
in one commit. FACTION_KEYS in catalog.py is copied TWICE in the MD ($keys + $factions, same
order); test_md_sync checks both copies.
After a catalog change, re-export: `python3 bridge/tools/export_catalog.py` (writes
docs/catalog/catalog.json).
ships.json and sectors.json are GENERATED from the X4 install (gen_ships.py, gen_sectors.py, see
the `world` pack): never edit them by hand. gen_ships reads loose-file extensions too
(x4cat.game_files), so an X4 Ship Forge ship installed in extensions/ gets a row. Prices: adopt = credits/1200, buy = /300, resurrect =
adopt x 1.5 (fleet.py, docs/10).
Adoptions are the bridge's truth (adoptions.json); MD is stateless about them (docs/10 §2).
Ship NAMES never cross the wire, only engine tokens (idcode, macro): docs/10 §3.
Tests: test_catalog, test_commands, test_economy, test_wallet, test_fleet, test_ships,
test_gen_ships, test_sectors, test_md_sync (all stdlib, all run under WSL).
"""

[tags.mod]
label = "In-game mod (MD + Lua)"
description = "extensions/twitch_integration/: md/twitch_integration.xml (the pipe loop, dispatch cues, every in-game effect), ui/twitch_integration.lua (JSON decode -> AddUITriggeredEvent), ui.xml, content.xml, t/ text; md/twitch_boso_lines.xml is generated"
color = "#00b5ad"
sort = 30
context = """
READ .claude/skills/x4-modding/SKILL.md FIRST: its MD traps each cost a debugging round, and
none of them errors at load. The ones that bite most often:
- `$x?` means DEFINED, not non-null; compare `== null`.
- Only strings cross Lua -> MD, and MD cannot split a string or parse a number: one value per
  payload, or put the second in the screen/control slot (SKILL.md, "Getting TWO values").
- signal_cue takes neither param nor delay: a self-signalling loop parks its state on a cue
  variable instead (Twitch_RankWatch keeps its snapshot in `static.$prev`).
- A cue under an instantiate="true" cue MUST have an event condition, or X4 drops it at load.
  md.xsd does not catch this; `python3 bridge/tools/test_md_sync.py` does.
- `--` inside an XML comment makes the whole file unparseable: draw rules with `=`.
BUILD STAMP: bump `$Build` in Twitch_Say on EVERY edit of twitch_integration.xml. It is the
only way to tell a stale script from a broken fix in chat.
Checks: `python3 -c "import xml.etree.ElementTree as E; E.parse('extensions/twitch_integration/md/twitch_integration.xml')"`,
then test_md_sync.py, then `python3 bridge/tools/test_md_lint.py` (signal_cue param/delay, an
event.param only signal_cue sends, $Build not bumped since HEAD), then the md.xsd validation:
`py.exe bridge/tools/validate_md.py` (Windows py has lxml; ~2 min to compile the schema, or
0.2 s while a `--serve` instance is up).
The MD file name must stay lowercase (DEVLOG, live bug 5). content.xml depends on
ws_2042901274 (SirNukes Mod Support APIs), not on a folder name.
X4 is a Windows game on this machine (<X4> on drive E, reachable under WSL at /mnt/e/…). It
needs Simon's GPU and screen. MD/Lua changes take effect on loading a save, after `deploy.ps1`
copies them in. An agent launches X4 ONLY through `py.exe bridge/tools/x4_run.py run`. It
refuses unless Simon has marked himself away with tools/x4-away.cmd (r24); `x4_run.py status`
says GO or why not. A ticket that must run X4 carries #ingame (read its pack). X4 is ONE
resource for the machine (every board shares it, r2): `run`
holds a machine lock from deploy to kill, and a second run is refused at once naming the holder
— do not retry in a loop; say so and release. The harness always kills X4 at the end. Never
launch X4 any other way, and never run deploy.ps1 by hand while a run holds X4,
and never touch the save folder unless the ticket asks. When the gate says NO, say what Simon
must load and what chat should show.
"""

[tags.world]
label = "World & game data"
description = "What the mod adds to the universe: extensions/twitch_arena/ (gamestarts, god.xml, maps/, the main-galaxy diff), the faction libraries (twitch_integration/libraries/: factions, characters, jobs, wares), and the generators/audits that read the X4 install (bridge/tools/gen_*.py, check_macros.py, .claude/skills/x4-modding/extract_x4.py)"
color = "#e8590c"
sort = 40
context = """
Golden rule (x4-modding SKILL.md): extract the vanilla file and mirror it exactly; a wrong case
in a diff `sel` or a wrong `../` depth fails silently or crashes new-game generation at ~90%.
Extract under WSL: `X4_DIR="/mnt/e/steam/steamapps/common/X4 Foundations" python3
.claude/skills/x4-modding/extract_x4.py --list <name>` (its default is the Windows path E:\\…).
Out to `_scratch/` (untracked).
Survey BASE GAME + extensions/ego_dlc_* ONLY: <X4>/extensions holds third-party mods too
(faction_fix_pack among them). After touching any macro reference:
`python3 bridge/tools/check_macros.py "/mnt/e/steam/steamapps/common/X4 Foundations"` (6 s).
twitch_arena is save="true": a gamestart, map or god.xml change needs a NEW game.
twitch_integration is save="0" and can be added to an existing save (extension READMEs);
its factions.xml and the stations its MD builds still live in that save.
A custom faction needs five things or its station builds and then does nothing:
.claude/skills/x4-modding/references/custom-factions.md (people, staffing, goods, licences,
logistics).
Generated, never hand-edited, re-run after a DLC or game update: gen_characters.py ->
libraries/characters.xml, gen_ware_owners.py -> libraries/wares.xml, gen_ships.py / gen_sectors.py
-> bridge/twitch_bridge/*.json, gen_boso_lines.py -> md/twitch_boso_lines.xml.
deploy.ps1 mirrors BOTH extensions into <X4>/extensions; install.sh is Linux-only and never
deployed twitch_arena. Same rule as `mod`: no deploy, no X4 launch unless the ticket asks.
"""

[tags.ingame]
label = "Runs X4"
description = "The ticket must LAUNCH X4 to be proved (py.exe bridge/tools/x4_run.py run). Add it alongside #mod/#world only when the game itself has to run, never for an MD edit that a recipe can hand back."
color = "#e03131"
sort = 35
context = """
X4 is ONE resource for the machine (r2): the board leases @x4 to the session holding an
#ingame ticket ([resources.x4] in the board file), so a second one is not served until it
ends, and x4_run.py's machine lock (every board, every checkout) refuses a second run naming
the holder. Launch ONLY through `py.exe bridge/tools/x4_run.py run [--expect REGEX]`: it
refuses unless Simon has marked himself away (tools/x4-away.cmd), deploys, starts X4
minimized and silent, waits for the line in <PROFILE>/agent_x4.txt, and always kills X4.
Run `x4_run.py status` first. When it says NO (Simon not away, X4 running, Steam off), do not
loop: note "retry when Simon is marked away" and `atelier release` the ticket, or hand back
the recipe (the save to load, the chat command, the line chat or x4debug.txt must show).
"""

